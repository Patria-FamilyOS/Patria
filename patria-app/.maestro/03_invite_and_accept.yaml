# PHONE_TESTS: 3
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'create'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "invite-someone"
      - tapOn:
          id: "their-email"
      - eraseText: 80
      - inputText: ${INVITE_EMAIL}
      - hideKeyboard
      - tapOn:
          id: "role-elder"
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: "create-invite"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "create-invite"
      - hideKeyboard
      - scrollUntilVisible:
          element: "Invite is ready. Share the link, send it by email, or both."
          direction: DOWN
          timeout: 20000
      - assertVisible: "Invite is ready. Share the link, send it by email, or both."
- runFlow:
    when:
      true: ${PHASE == 'share_copy'}
    file: subflows/try_share_copy.yaml
- runFlow:
    when:
      true: ${PHASE == 'accept'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - assertVisible: "Create our family"
      - tapOn:
          id: "invite-link"
      - eraseText
      - inputText: ${INVITE_URL}
      - tapOn:
          id: "open"
      - assertVisible: "You are invited"
      - tapOn:
          id: "accept"
      - extendedWaitUntil:
          visible:
            id: "home"
          timeout: 45000
      - assertVisible: "Your family"
