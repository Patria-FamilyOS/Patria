# PHONE_TESTS: 4
# AREAS: invites, auth
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'create'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - scrollUntilVisible:
          element:
            id: "invite-someone"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "invite-someone"
      - tapOn:
          id: "their-email"
      - eraseText: 80
      - inputText: ${INVITE_EMAIL}
      - hideKeyboard
      - tapOn:
          id: "role-elder"
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: "create-invite"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "create-invite"
      - hideKeyboard
      - scrollUntilVisible:
          element: "Invite is ready. Share the link, send it by email, or both."
          direction: DOWN
          timeout: 20000
      - assertVisible: "Invite is ready. Share the link, send it by email, or both."
      - scrollUntilVisible:
          element:
            id: "revoke"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "revoke"
      - assertVisible: "No pending invites."
- runFlow:
    when:
      true: ${PHASE == 'share_copy'}
    file: subflows/try_share_copy.yaml
- runFlow:
    when:
      true: ${PHASE == 'open_revoked'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "invite-link"
      - eraseText
      - inputText: ${INVITE_URL}
      - tapOn:
          id: "open"
      - assertVisible:
          id: "invite-no-longer-valid"
          text: ".*no longer valid.*"
      - assertNotVisible: "PGRST"
      - tapOn:
          id: "continue"
          optional: true
      - runFlow:
          file: subflows/sign_out.yaml
      - runFlow:
          file: subflows/sign_in.yaml
      - assertNotVisible: "You are invited"
