# PHONE_TESTS: 15
# AREAS: memories
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'add_a'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - addMedia:
          - "media/sample1.jpg"
          - "media/sample2.jpg"
      - tapOn:
          id: "memories"
      - tapOn:
          id: "add-photos"
      - extendedWaitUntil:
          visible:
            id: "circle-household-selected"
          timeout: 20000
      - tapOn:
          id: "caption-optional"
      - inputText: "Photo A"
      - tapOn:
          id: "circle-explanation"
      - tapOn:
          id: "share"
      - extendedWaitUntil:
          visible:
            id: "screen-memories"
          timeout: 45000
      - extendedWaitUntil:
          visible: "Photo A"
          timeout: 20000
- runFlow:
    when:
      true: ${PHASE == 'add_b'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "memories"
      - tapOn:
          id: "add-photos"
      - extendedWaitUntil:
          visible:
            id: "circle-extended_family"
          timeout: 20000
      - tapOn:
          id: "circle-extended_family"
      - tapOn:
          id: "caption-optional"
      - inputText: "Photo B"
      - tapOn:
          id: "circle-explanation"
      - tapOn:
          id: "share"
      - extendedWaitUntil:
          visible:
            id: "screen-memories"
          timeout: 45000
      - extendedWaitUntil:
          visible: "Photo B"
          timeout: 20000
- runFlow:
    when:
      true: ${PHASE == 'test2'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "memories"
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - extendedWaitUntil:
          visible: "Photo A"
          timeout: 20000
      - assertNotVisible: "Photo B"
- runFlow:
    when:
      true: ${PHASE == 'test3'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "memories"
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - extendedWaitUntil:
          visible: "Photo B"
          timeout: 20000
      - assertNotVisible: "Photo A"
- runFlow:
    when:
      true: ${PHASE == 'add_c'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "memories"
      - tapOn:
          id: "add-photos"
      - extendedWaitUntil:
          visible:
            id: "circle-only_me"
          timeout: 20000
      - tapOn:
          id: "circle-only_me"
      - tapOn:
          id: "caption-optional"
      - inputText: "Photo C"
      - tapOn:
          id: "circle-explanation"
      - tapOn:
          id: "share"
      - extendedWaitUntil:
          visible:
            id: "screen-memories"
          timeout: 45000
      - extendedWaitUntil:
          visible: "Photo C"
          timeout: 20000
- runFlow:
    when:
      true: ${PHASE == 'others_no_c'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "memories"
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - assertNotVisible: "Photo C"
