# PHONE_TESTS: 17
# AREAS: memories
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'seed'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - addMedia:
          - "media/sample1.jpg"
          - "media/sample2.jpg"
      - tapOn:
          id: "memories"
      - tapOn:
          id: "add-photos"
      - extendedWaitUntil:
          visible:
            id: "circle-extended_family"
          timeout: 20000
      - tapOn:
          id: "circle-extended_family"
      - tapOn:
          id: "caption-optional"
      - inputText: "Photo B"
      - tapOn:
          id: "circle-explanation"
      - tapOn:
          id: "share"
      - extendedWaitUntil:
          visible:
            id: "screen-memories"
          timeout: 45000
      - extendedWaitUntil:
          visible: "Photo B"
          timeout: 20000
- runFlow:
    when:
      true: ${PHASE == 'remove_member'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - scrollUntilVisible:
          element:
            id: "member-test-3"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "member-test-3"
      - tapOn:
          id: "^remove-from-this-family$"
      - tapOn:
          text: "Remove from this family"
          index: 1
- runFlow:
    when:
      true: ${PHASE == 'no_photos'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - assertNotVisible: "Photo B"
      - assertNotVisible: "Memories"
