# PHONE_TESTS: 9
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'invite'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "invite-someone"
      - tapOn:
          id: "their-email"
      - eraseText: 80
      - inputText: ${INVITE_EMAIL}
      - hideKeyboard
      - tapOn:
          id: ${ROLE_ID}
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: "create-invite"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "create-invite"
      - hideKeyboard
      - scrollUntilVisible:
          element: "Invite is ready. Share the link, send it by email, or both."
          direction: DOWN
          timeout: 20000
      - assertVisible: "Invite is ready. Share the link, send it by email, or both."
- runFlow:
    when:
      true: ${PHASE == 'waiting'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - assertVisible: "Waiting for a family admin to let this phone in"
- runFlow:
    when:
      true: ${PHASE == 'let_in'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - assertVisible: "wants this phone let in"
      - tapOn:
          id: "let-in"
      - extendedWaitUntil:
          notVisible: "wants this phone let in"
          timeout: 20000
- runFlow:
    when:
      true: ${PHASE == 'keys_ready'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - assertVisible: "Family keys: set up on this phone"
- runFlow:
    when:
      true: ${PHASE == 'no_notice'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - assertNotVisible: "wants this phone let in"
- runFlow:
    when:
      true: ${PHASE == 'decline'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - assertVisible: "wants this phone let in"
      - tapOn:
          id: "decline"
      - assertNotVisible: "Let in"
