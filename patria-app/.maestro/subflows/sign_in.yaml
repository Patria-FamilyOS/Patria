appId: app.patria.dev
---
- launchApp
- runFlow:
    file: dismiss_open_in.yaml
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    text: "Reload"
    optional: true
- extendedWaitUntil:
    notVisible: "Just a moment…"
    timeout: 30000
- runFlow:
    when:
      visible: "Loading from Metro..."
    commands:
      - extendedWaitUntil:
          notVisible: "Loading from Metro..."
          timeout: 120000
- runFlow:
    when:
      visible:
        id: "^screen-sign-up$"
    commands:
      - tapOn:
          id: "^already-have-an-account-sign-in$"
      - extendedWaitUntil:
          visible:
            id: "^screen-sign-in$"
          timeout: 20000
- runFlow:
    when:
      visible: ${E2E_HELLO}
    commands:
      - extendedWaitUntil:
          visible:
            id: "^home$"
          timeout: 20000
- runFlow:
    when:
      notVisible: ${E2E_HELLO}
    file: sign_in_form.yaml
- tapOn:
    text: "Not Now"
    optional: true
- runFlow:
    when:
      true: ${EXPECT_HOME == '0'}
    commands:
      - extendedWaitUntil:
          visible:
            id: "^screen-create-family$|^home$"
          timeout: 45000
      - runFlow:
          when:
            visible: "Create a family space"
          commands:
            - tapOn: "Create our family"
            - extendedWaitUntil:
                visible:
                  id: "screen-create-family"
                timeout: 20000
- runFlow:
    when:
      true: ${EXPECT_HOME != '0'}
    commands:
      - extendedWaitUntil:
          visible:
            id: "^home$|^screen-waiting-own-phone$"
          timeout: 45000
