appId: app.patria.dev
---
- launchApp
- tapOn:
    id: "sign-out"
    optional: true
- tapOn:
    id: "i-already-have-an-account"
    optional: true
- tapOn:
    id: "email"
- eraseText
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "password"
- eraseText
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in"
- extendedWaitUntil:
    visible: "Sign out"
    timeout: 30000
