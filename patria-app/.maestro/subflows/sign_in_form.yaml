appId: app.patria.dev
---
- runFlow:
    when:
      visible:
        id: "^home$"
    commands:
      - scrollUntilVisible:
          element:
            id: "^sign-out$"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "^sign-out$"
      - extendedWaitUntil:
          visible: "I already have an account"
          timeout: 30000
- runFlow:
    when:
      visible: "Create our family"
    commands:
      - tapOn:
          id: "^sign-out$"
      - extendedWaitUntil:
          visible: "I already have an account"
          timeout: 30000
- tapOn:
    text: "Already have an account? Sign in"
    optional: true
- tapOn:
    id: "^already-have-an-account-sign-in$"
    optional: true
- tapOn:
    id: "^i-already-have-an-account$"
    optional: true
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "^email$"
    timeout: 30000
- tapOn:
    id: "^email$"
- eraseText
- inputText: ${E2E_EMAIL}
- hideKeyboard
- tapOn:
    id: "^password$"
- eraseText
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: "Return"
    optional: true
- tapOn:
    id: "^sign-in$"
- tapOn:
    text: "Not Now"
    optional: true
