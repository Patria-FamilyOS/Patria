# PHONE_TESTS: 5
# AREAS: auth
appId: app.patria.dev
---
- runFlow:
    file: subflows/sign_in.yaml
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible: "I already have an account"
    timeout: 20000
- swipe:
    start: 2%, 50%
    end: 80%, 50%
- assertVisible: "I already have an account"
